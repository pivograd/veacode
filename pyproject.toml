[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "veacode"
version = "0.1.0"
description = "Local durable controller for Claude Code, Codex and OpenCode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
veacode = "veacode.cli:main"

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/veacode"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

